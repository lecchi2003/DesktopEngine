<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Desktop Engine V0.6 - Taskbar StartMenu Showcase</title>
    <link rel="stylesheet" href="./style.css?v=14">
</head>

<body>
    <div id="app">
        <div id="desktop">
            <div id="windows"></div>
        </div>
        <div id="taskbar">
            <button class="taskStart" id="startBtn">Menu</button>
            <button class="taskStart" id="showDesktop">Desktop</button>
            <div class="taskWindows" id="taskWindows"></div>
            <div class="clock" id="clock"></div>
        </div>
    </div>

    <script type="module">
        import { Framework } from './core.js';
        import { Desktop } from './desktop.js';
        import {
            StartMenu, ContextMenu, bindContextMenu, TreeView, Tabs, Modal, WebView, DraggableList, DataGrid,
            Form, Input, Textarea, Select, Checkbox, Toggle, Button,
            Grid, Card, Row, Col, Badge, ProgressBar, Table, createElement, printElement,
            Alert, Spinner, Toast, Accordion, Drawer, Breadcrumbs, Stepper,
            Slider, RadioGroup, Autocomplete, Tooltip, Avatar, Carousel, Skeleton
        } from './ui.js';

        // Inicializa o desktop na posição escolhida
        Desktop.init({
            windowsContainerId: "windows",
            taskbarContainerId: "taskWindows",
            taskbarPosition: "bottom", // Pode ser 'top', 'bottom', 'left', 'right'
            showDesktopButton: true
        });

        function updateClock() {
            document.getElementById("clock").textContent = new Date().toLocaleTimeString("pt-BR");
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById("showDesktop").onclick = () => Desktop.showDesktop();

        // --- MENU INICIAR (TASKBAR / ESTILO WINDOWS) ---
        StartMenu({
            buttonId: "startBtn",
            menus: [
                {
                    label: "📐 Exemplos de Telas",
                    items: [
                        { label: "⚡ 1. Criação Direta (Inline)", action: () => window.location.href = 'index-direct.html' },
                        { label: "📦 2. Lazy Loading Modular", action: () => window.location.href = 'index-lazy.html' },
                        { label: "🏭 3. Factory / Geradores", action: () => window.location.href = 'index-factory.html' },
                        { label: "🏛️ 4. Classes ES6 (OOP)", action: () => window.location.href = 'index-class.html' },
                        { label: "📄 5. Templates HTML Puro", action: () => window.location.href = 'index-template.html' },
                        "separator",
                        { label: "Hub de Arquiteturas de Telas", screen: "hub_arquiteturas" },
                        "separator",
                        { label: "🖥️ Layout macOS (index.html)", action: () => window.location.href = 'index.html' },
                        { label: "🪟 Layout Windows (index2.html) [Atual]", action: () => Desktop.openScreen("hub_arquiteturas") },
                        { label: "📚 Documentação Oficial", action: () => window.location.href = 'docs.html' }
                    ]
                },
                "separator",
                {
                    label: "Módulos",
                    items: [
                        { label: "Hub de Arquiteturas", screen: "hub_arquiteturas" },
                        "separator",
                        { label: "🪟 Janelas Modais Filhas (Dialogs)", screen: "child_modal_demo" },
                        { label: "⏱️ Monitor de Ciclo de Vida (Hooks)", screen: "lifecycle_demo" },
                        { label: "🛍️ CRUD de Produtos (API Python)", screen: "crud_api" },
                        { label: "Editor de Documentos (Window MenuBar)", screen: "editor" },
                        { label: "Painel de Controle (Lazy)", screen: "dashboard" },
                        { label: "Listagem Avançada (DataGrid) (Lazy)", screen: "datagrid" },
                        { label: "Navegador Web (Window MenuBar)", screen: "browser" },
                        { label: "Formulários e Cadastros", screen: "forms" },
                        { label: "Gerenciador de Tarefas", screen: "tasks" },
                        { label: "Showcase de Componentes", screen: "showcase" }
                    ]
                },
                "separator",
                {
                    label: "Exibir",
                    items: [
                        { label: "Organizar Janelas em Grade", action: () => Desktop.arrangeWindows() },
                        { label: "Mostrar Área de Trabalho", action: () => Desktop.showDesktop() }
                    ]
                },
                "separator",
                {
                    label: "Sistema",
                    items: [
                        {
                            label: "Preferências",
                            items: [
                                { label: "Alternar Tema (Light/Dark)", action: () => Desktop.toggleTheme() },
                                {
                                    label: "Paleta de Cores",
                                    items: [
                                        { label: "Azul Corporativo (Padrão)", action: () => Desktop.setTheme("light") },
                                        { label: "Slate Dark", action: () => Desktop.setTheme("dark") },
                                        { label: "Midnight Cyber", action: () => Desktop.setTheme("midnight") },
                                        { label: "Emerald Fintech", action: () => Desktop.setTheme("emerald") },
                                        { label: "Nord Frost", action: () => Desktop.setTheme("nord") },
                                        { label: "Alto Contraste (Windows Classic)", action: () => Desktop.setTheme("contrast") }
                                    ]
                                },
                                {
                                    label: "Look and Feel (Aparência do SO)",
                                    items: [
                                        {
                                            label: "🍎 & 🪟 Modernos",
                                            items: [
                                                { label: "✨ Padrão (DesktopEngine)", action: () => Desktop.setLookAndFeel("default") },
                                                { label: "🍎 macOS (Aqua Modern)", action: () => Desktop.setLookAndFeel("macos") },
                                                { label: "🪟 Windows 11 (Fluent)", action: () => Desktop.setLookAndFeel("win11") }
                                            ]
                                        },
                                        {
                                            label: "☕ Ecossistema Java",
                                            items: [
                                                { label: "☕ Java Metal (Steel Classic)", action: () => Desktop.setLookAndFeel("java-metal") },
                                                { label: "🌊 Java Ocean (Metal 2.0)", action: () => Desktop.setLookAndFeel("java-ocean") },
                                                { label: "✨ Java Nimbus", action: () => Desktop.setLookAndFeel("java-nimbus") },
                                                { label: "🎨 FlatLaf (IDE IntelliJ)", action: () => Desktop.setLookAndFeel("java-flatlaf") },
                                                { label: "🌿 JavaFX Modena", action: () => Desktop.setLookAndFeel("javafx-modena") },
                                                { label: "🔷 JavaFX Caspian", action: () => Desktop.setLookAndFeel("javafx-caspian") }
                                            ]
                                        },
                                        {
                                            label: "🕹️ Clássicos & Retrô",
                                            items: [
                                                { label: "🟡 BeOS / Haiku OS", action: () => Desktop.setLookAndFeel("beos") },
                                                { label: "🕹️ Windows 98 (Classic 3D)", action: () => Desktop.setLookAndFeel("win98") },
                                                { label: "🔵 Windows XP (Luna)", action: () => Desktop.setLookAndFeel("winxp") },
                                                { label: "🪟 Windows 7 (Aero Glass)", action: () => Desktop.setLookAndFeel("win7") },
                                                { label: "⬛ NeXTSTEP / OpenStep", action: () => Desktop.setLookAndFeel("nextstep") },
                                                { label: "💾 AmigaOS (Workbench)", action: () => Desktop.setLookAndFeel("amiga") },
                                                { label: "🍏 Mac OS System 7", action: () => Desktop.setLookAndFeel("mac-classic") },
                                                { label: "🟦 OS/2 Warp (IBM)", action: () => Desktop.setLookAndFeel("os2-warp") }
                                            ]
                                        },
                                        {
                                            label: "🐧 UNIX & Linux",
                                            items: [
                                                { label: "🟣 CDE / Motif (Solaris)", action: () => Desktop.setLookAndFeel("cde-motif") },
                                                { label: "🐧 GNOME (Adwaita)", action: () => Desktop.setLookAndFeel("gnome") },
                                                { label: "⚙️ KDE (Breeze)", action: () => Desktop.setLookAndFeel("kde") }
                                            ]
                                        },
                                        {
                                            label: "💻 TUI & Sci-Fi",
                                            items: [
                                                { label: "📟 Turbo Vision (DOS TUI)", action: () => Desktop.setLookAndFeel("turbovision") },
                                                { label: "⚡ Cyberpunk HUD", action: () => Desktop.setLookAndFeel("cyberpunk") }
                                            ]
                                        }
                                    ]
                                },
                                { label: "Idioma...", action: () => Desktop.notify("Idioma em pt-BR", "info") }
                            ]
                        },
                        "separator",
                        { label: "Sobre (Lazy Load)", screen: "sobre" }
                    ]
                }
            ]
        });

        document.getElementById("desktop").addEventListener("contextmenu", (e) => {
            e.preventDefault();
            ContextMenu({
                x: e.clientX, y: e.clientY,
                items: [
                    { label: "Hub de Arquiteturas de Telas", screen: "hub_arquiteturas" },
                    "separator",
                    { label: "Nova Anotação Rápida", action: () => abrirAnotacao() },
                    "separator",
                    { label: "Abrir Painel (Lazy)", screen: "dashboard" },
                    { label: "Abrir DataGrid (Lazy)", screen: "datagrid" },
                    { label: "Showcase Completo", screen: "showcase" }
                ]
            });
        });

        // --- TELAS DO SHOWCASE ---

        // 1. Tela Multi-instância (Post-it / Anotação)
        let anotacaoCount = 1;
        function abrirAnotacao() {
            const AnotacaoScreen = {
                title: `Anotação #${anotacaoCount++}`,
                icon: "📝",
                width: 320,
                height: 260,
                singleInstance: false, // Pode abrir infinitas!
                state: { texto: "" },
                view() {
                    const field = Textarea({
                        bind: "texto",
                        instance: this,
                        placeholder: "Digite sua anotação...",
                        style: "height: 100%; display: flex; flex-direction: column; flex: 1;"
                    });
                    const txtEl = field.querySelector('textarea');
                    if (txtEl) {
                        txtEl.style.flex = "1";
                        txtEl.style.resize = "none";
                        txtEl.style.height = "100%";
                    }
                    return createElement("div", "flex-col", [field]);
                }
            };
            Desktop.open(Framework.createWindow(AnotacaoScreen, `anotacao_${Date.now()}`, Desktop));
        }

        // 2. Telas Modulares são carregadas sob demanda da pasta ./screens/
        // (EditorScreen, BrowserScreen, DashboardScreen, DataGridScreen e SobreScreen estão em /screens)

        const TaskScreen = {
            title: "Gerenciador de Tarefas",
            icon: "✅",
            width: 450,
            height: 500,
            singleInstance: true,
            state: {
                tarefas: [
                    "Finalizar relatório mensal",
                    "Reunião de alinhamento com a diretoria",
                    "Aprovar pagamentos do setor de TI",
                    "Revisar arquitetura do sistema v0.3",
                    "Planejar confraternização da equipe"
                ]
            },
            actions: {
                reorder: [async (ctx, next, newItems) => {
                    ctx.instance.setStatus("Ordem salva: " + new Date().toLocaleTimeString());
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Priorize arrastando (Drag & Drop)", children: [
                            DraggableList({ bindItems: "tarefas", onReorder: "reorder", instance: this })
                        ]
                    })
                ]);
            }
        };

        const FormsScreen = {
            title: "Cadastro Avançado",
            icon: "📝",
            width: 600,
            height: 550,
            singleInstance: true,
            status: "Aguardando preenchimento",
            state: {
                nome: "", dataNasc: "", salario: "", senioridade: "pleno", ativo: true
            },
            actions: {
                salvar: [async (ctx) => {
                    Modal({
                        title: "Confirmar Inclusão",
                        instance: ctx.instance,
                        children: [
                            createElement("p", "", [`Deseja salvar o funcionário ${ctx.state.nome}?`]),
                            Button({
                                text: "Sim, salvar", onClick: () => {
                                    Desktop.notify("Salvo com sucesso!", "success");
                                    ctx.instance.setStatus(`Salvo em ${new Date().toLocaleTimeString()}`);
                                    document.querySelector('.ui-modal-overlay').remove();
                                }, variant: "success"
                            })
                        ]
                    });
                }]
            },
            view() {
                return createElement("div", "", [
                    Card({
                        title: "Dados Pessoais", children: [
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Nome Completo", bind: "nome", instance: this }),
                                    Input({ label: "Data de Nascimento", bind: "dataNasc", instance: this, type: "date" })
                                ]
                            }),
                            Grid({
                                columns: 2, children: [
                                    Input({ label: "Pretensão Salarial", bind: "salario", instance: this, type: "number" }),
                                    Select({
                                        label: "Senioridade", bind: "senioridade", instance: this, options: [
                                            { label: "Júnior", value: "junior" },
                                            { label: "Pleno", value: "pleno" },
                                            { label: "Sênior", value: "senior" }
                                        ]
                                    })
                                ]
                            }),
                            Row({
                                children: [
                                    Toggle({ label: "Funcionário Ativo", bind: "ativo", instance: this })
                                ]
                            })
                        ]
                    }),
                    createElement("br", "", []),
                    Button({ text: "Salvar Cadastro", onClick: "salvar", instance: this, variant: "primary" })
                ]);
            }
        };

        const ComponentShowcaseScreen = {
            title: "Showcase de Componentes UI",
            icon: "✨",
            width: 850,
            height: 600,
            singleInstance: true,
            state: {
                step: 0,
                volume: 50,
                tema: Desktop.getTheme ? Desktop.getTheme() : "light",
                laf: Desktop.getLookAndFeel ? Desktop.getLookAndFeel() : "default",
                pais: ["Brasil"],
                menuLateral: false
            },
            actions: {
                nextStep: [async (ctx) => {
                    if (ctx.state.step < 3) ctx.state.step++;
                    Toast({ message: "Avançou para o passo " + (ctx.state.step + 1), type: "info" });
                }],
                prevStep: [async (ctx) => {
                    if (ctx.state.step > 0) ctx.state.step--;
                }],
                toggleDrawer: [async (ctx) => {
                    ctx.state.menuLateral = !ctx.state.menuLateral;
                }],
                salvarTudo: [async (ctx) => {
                    Toast({ message: "Dados do showcase salvos no sistema!", type: "success" });
                }],
                abrirModalLocal: [async (ctx) => {
                    Modal({
                        title: "Modal Local",
                        instance: ctx.instance,
                        children: [
                            createElement("p", "", ["Este modal está restrito aos limites da janela."]),
                            Button({
                                text: "Fechar", onClick: () => {
                                    document.querySelector('.ui-modal-overlay.show').remove();
                                }
                            })
                        ]
                    });
                }],
                abrirModalGlobal: [async (ctx) => {
                    Modal({
                        title: "Modal Global",
                        instance: ctx.instance,
                        targetContainer: document.getElementById("app"),
                        children: [
                            createElement("p", "", ["Este modal se sobrepõe a TODAS as janelas e ao Desktop."]),
                            Button({
                                text: "Fechar", onClick: () => {
                                    document.querySelector('.ui-modal-overlay.show').remove();
                                }
                            })
                        ]
                    });
                }]
            },
            view() {
                // Aplica o tema globalmente no Desktop Engine
                if (Desktop && typeof Desktop.setTheme === 'function') {
                    Desktop.setTheme(this.state.tema);
                } else {
                    document.documentElement.setAttribute('data-theme', this.state.tema);
                }

                // Aplica o Look and Feel globalmente no Desktop Engine
                if (Desktop && typeof Desktop.setLookAndFeel === 'function') {
                    Desktop.setLookAndFeel(this.state.laf);
                }

                return createElement("div", "", [
                    // GRUPO 2: Drawer e Breadcrumbs
                    Drawer({
                        bind: "menuLateral", side: "left", instance: this, content: [
                            createElement("h3", "", ["Menu do Showcase"]),
                            createElement("p", "", ["Este é um painel off-canvas integrado ao state."])
                        ]
                    }),
                    Breadcrumbs({
                        items: [
                            { label: "Módulos", action: () => Toast({ message: "Você clicou no breadcrumb", type: "info" }) },
                            { label: "Showcase UI" }
                        ]
                    }),

                    Row({
                        children: [
                            Col({
                                style: "flex: 1;", children: [
                                    createElement("h2", "", ["Painel de Elementos Visuais"]),
                                ]
                            }),
                            Row({
                                style: "gap: 8px;", children: [
                                    Button({ text: "Modal Local", onClick: "abrirModalLocal", instance: this }),
                                    Button({ text: "Modal Global", onClick: "abrirModalGlobal", instance: this, variant: "danger" }),
                                    Button({ text: "Abrir Drawer Esq.", onClick: "toggleDrawer", instance: this })
                                ]
                            })
                        ]
                    }),

                    // GRUPO 2: Stepper
                    Stepper({ steps: ["Configuração", "Preferências", "Visual", "Confirmação"], currentStep: this.state.step }),

                    Row({
                        children: [
                            // Coluna Esquerda
                            Col({
                                style: "flex: 1; margin-right: 16px;", children: [
                                    Card({
                                        title: "Aparência e Look & Feel do Sistema", children: [
                                            Select({
                                                label: "Look and Feel (Skin do SO)", bind: "laf", instance: this, options: [
                                                    { label: "✨ Padrão (DesktopEngine Modern)", value: "default" },
                                                    { label: "🍎 macOS (Aqua Modern - Semáforo Esq.)", value: "macos" },
                                                    { label: "🪟 Windows 11 (Fluent Design)", value: "win11" },
                                                    { label: "☕ Java Metal (Steel Classic)", value: "java-metal" },
                                                    { label: "🌊 Java Ocean (Metal 2.0)", value: "java-ocean" },
                                                    { label: "✨ Java Nimbus (Vetor & Ouro)", value: "java-nimbus" },
                                                    { label: "🎨 FlatLaf (IDE IntelliJ/NetBeans)", value: "java-flatlaf" },
                                                    { label: "🌿 JavaFX Modena (Modern Neutral)", value: "javafx-modena" },
                                                    { label: "🔷 JavaFX Caspian (Dark Blue Glass)", value: "javafx-caspian" },
                                                    { label: "🟡 BeOS / Haiku (Aba Amarela Topo)", value: "beos" },
                                                    { label: "🕹️ Windows 98 (Classic 3D Outset)", value: "win98" },
                                                    { label: "🔵 Windows XP (Luna Blue & Red)", value: "winxp" },
                                                    { label: "🪟 Windows 7 (Aero Glass Translúcido)", value: "win7" },
                                                    { label: "⬛ NeXTSTEP / OpenStep (3D Monocromático)", value: "nextstep" },
                                                    { label: "💾 AmigaOS (Workbench 4-Cores)", value: "amiga" },
                                                    { label: "🍏 Mac OS System 7 (Pinstripes Retrô)", value: "mac-classic" },
                                                    { label: "🟦 OS/2 Warp (IBM Corporate 3D)", value: "os2-warp" },
                                                    { label: "🟣 CDE / Motif (Solaris UNIX)", value: "cde-motif" },
                                                    { label: "🐧 GNOME (Adwaita Headerbar)", value: "gnome" },
                                                    { label: "⚙️ KDE (Breeze Vector Accent)", value: "kde" },
                                                    { label: "📟 Turbo Vision (DOS TUI Monospace)", value: "turbovision" },
                                                    { label: "⚡ Cyberpunk HUD (Neon Chamfered)", value: "cyberpunk" }
                                                ]
                                            }),
                                            RadioGroup({
                                                label: "Paleta de Cores do Sistema", bind: "tema", options: [
                                                    { label: "Light (Azul)", value: "light" },
                                                    { label: "Dark (Slate)", value: "dark" },
                                                    { label: "Midnight", value: "midnight" },
                                                    { label: "Emerald", value: "emerald" },
                                                    { label: "Nord", value: "nord" },
                                                    { label: "Alto Contraste", value: "contrast" }
                                                ], layout: "horizontal", instance: this
                                            }),
                                            Slider({ label: "Nível de Intensidade", bind: "volume", min: 0, max: 100, instance: this }),
                                            Autocomplete({ label: "Países de Atuação", bind: "pais", multiple: true, options: ["Brasil", "Estados Unidos", "Alemanha", "França", "Itália", "Japão"], instance: this })
                                        ]
                                    }),

                                    createElement("br", "", []),

                                    Card({
                                        title: "Feedback e Notificações", children: [
                                            // GRUPO 1: Feedback
                                            Alert({ text: "Esta é uma demonstração de todos os novos componentes reunidos.", variant: "success" }),
                                            Row({
                                                style: "align-items: center; gap: 12px;", children: [
                                                    Spinner({ size: "20px", color: "var(--btn-primary)" }),
                                                    createElement("span", "", ["Carregando recursos em segundo plano..."])
                                                ]
                                            })
                                        ]
                                    })
                                ]
                            }),

                            // Coluna Direita
                            Col({
                                style: "flex: 1;", children: [
                                    Card({
                                        title: "Componentes Visuais", children: [
                                            // GRUPO 4: Visuais
                                            Row({
                                                style: "align-items: center; gap: 16px; margin-bottom: 16px;", children: [
                                                    Tooltip({
                                                        position: "top", content: "Administrador Online", children:
                                                            Avatar({ initials: "AD", status: "online", size: 48 })
                                                    }),
                                                    Col({
                                                        children: [
                                                            createElement("strong", "", ["Admin System"]),
                                                            createElement("span", "text-secondary", ["Nível: Acesso Total"])
                                                        ]
                                                    })
                                                ]
                                            }),

                                            createElement("label", "", ["Destaques Recentes (Carousel)"]),
                                            Carousel({
                                                height: "120px",
                                                controlsPosition: "bottom-center",
                                                prevControl: Button({ text: "◀" }),
                                                nextControl: Button({ text: "▶" }),
                                                items: [
                                                    createElement("div", "p-3 text-center", ["Destaque 1"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 2"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 3"]),
                                                    createElement("div", "p-3 text-center", ["Destaque 4"])
                                                ]
                                            }),

                                            createElement("br", "", []),
                                            createElement("label", "", ["Carregamento Simulado (Skeleton)"]),
                                            Skeleton({ width: "100%", height: "40px", shape: "rect" })
                                        ]
                                    }),

                                    createElement("br", "", []),

                                    Card({
                                        title: "Seções Dinâmicas", children: [
                                            // GRUPO 2: Accordion
                                            Accordion({
                                                instance: this, items: [
                                                    { title: "Mais Opções", content: "Aqui poderiam existir sub-configurações." },
                                                    { title: "Ajuda do Sistema", content: "Documentação integrada ao painel de configurações." }
                                                ]
                                            })
                                        ]
                                    })
                                ]
                            })
                        ]
                    }),

                    createElement("br", "", []),

                    // Botões de Navegação do Stepper
                    Row({
                        style: "justify-content: space-between;", children: [
                            Button({ text: "Passo Anterior", onClick: "prevStep", instance: this }),
                            Row({
                                style: "gap: 8px;", children: [
                                    Button({ text: "Avançar Passo", onClick: "nextStep", instance: this }),
                                    Button({ text: "Concluir Setup", onClick: "salvarTudo", instance: this, variant: "primary" })
                                ]
                            })
                        ]
                    })
                ]);
            }
        };

        // 0. Central / Hub de Arquiteturas de Telas
        const HubArquiteturasScreen = {
            title: "Hub de Arquiteturas & Formas de Criação de Telas",
            icon: "📐",
            width: 820,
            height: 560,
            singleInstance: true,
            status: "5 Padrões Arquiteturais Disponíveis",
            state: {},
            view() {
                return createElement("div", "", [
                    Alert({
                        text: "O DesktopEngine suporta múltiplos paradigmas de desenvolvimento para criação de telas. Clique nos cards abaixo para abrir a página dedicada de cada arquitetura!",
                        variant: "info"
                    }),
                    Grid({
                        columns: 2,
                        children: [
                            Card({
                                title: "⚡ 1. Criação Direta (Inline)",
                                children: [
                                    createElement("p", "text-secondary", ["Objetos literais declarados no próprio script. Ideal para post-its, multi-instâncias e utilitários rápidos."]),
                                    Button({ text: "Abrir index-direct.html ↗", onClick: () => window.location.href = 'index-direct.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "📦 2. Lazy Loading Modular",
                                children: [
                                    createElement("p", "text-secondary", ["Arquivos .js isolados na pasta /screens/ carregados sob demanda via ES Modules dynamic import()."]),
                                    Button({ text: "Abrir index-lazy.html ↗", onClick: () => window.location.href = 'index-lazy.html', variant: "primary" })
                                ]
                            }),
                            Card({
                                title: "🏭 3. Factory / Geradores",
                                children: [
